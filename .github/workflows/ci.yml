name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test installed CLI
        run: |
          api-doc --help
          api-doc scan tests/fixtures/fastapi_project \
            --format openapi \
            --output-dir "$RUNNER_TEMP/api-doc-smoke"
          python -m json.tool "$RUNNER_TEMP/api-doc-smoke/openapi.json" > /dev/null
